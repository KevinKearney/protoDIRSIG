# Conda environment for protoDIRSIG.
# dirfm is not on PyPI/conda-forge; the install order after creating this environment
# is in docs/MANIFOLD_DIRSIG_CONOPS_and_Guide.md, section 11 (Reproduce from zero).
name: protodirsig
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - lxml
  - h5py
  - matplotlib
  - pyyaml        # manifold_run_specs/*.yaml (protodirsig.run_spec)
  - skyfield      # SGP4 (via sgp4) + TEME->ITRS frame chain for TLE propagation
  - jupyter
  - jsonschema
  - pip
  - pip:
      - spectral
      - imageio
      - pygltflib
      - ruff
