[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protodirsig"
version = "0.0.1"
description = "SSA/RSO synthetic-imagery batch driver built on dirfm and dirsig5"
requires-python = ">=3.10"
dependencies = [
    "lxml",
    "numpy",
    "spectral",
    "imageio",
    "scipy",
    "h5py",
    "matplotlib",
    "pyyaml",
    "jsonschema",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyter", "openapi-spec-validator"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
protodirsig = ["_contracts/*.json"]   # copied from manifold_contracts/ at build time (setup.py); not tracked

[tool.pytest.ini_options]
testpaths = ["tests"]       # external/ holds dirfm's own demos/test_*.py; they are not this suite
tmp_path_retention_policy = "failed"
filterwarnings = ["ignore:LocalRegistry is deprecated:DeprecationWarning"]   # the notebook-era tests still use it   # a passing test's tmp_path (job inputs, renders) is deleted at its teardown
