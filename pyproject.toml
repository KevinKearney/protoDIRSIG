[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protodirsig"
version = "0.0.1"
description = "SSA/RSO synthetic-imagery batch driver built on dirfm and dirsig5"
requires-python = ">=3.10"
dependencies = [
    "lxml",
    "numpy",
    "spectral",
    "imageio",
    "scipy",
    "h5py",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyter", "jsonschema", "openapi-spec-validator"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]       # external/ holds dirfm's own demos/test_*.py; they are not this suite
