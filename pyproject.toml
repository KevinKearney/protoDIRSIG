# Repository-wide tool configuration. The distributions are under packages/ (packages/core: eoptic-manifold-core,
# packages/sim: eoptic-manifold-sim), one pyproject.toml each; this file builds nothing.

[tool.pytest.ini_options]
testpaths = ["tests"]       # external/ holds dirfm's own demos/test_*.py; they are not this suite
tmp_path_retention_policy = "failed"   # a passing test's tmp_path (job inputs, renders) is deleted at its teardown
filterwarnings = ["ignore:LocalRegistry is deprecated:DeprecationWarning"]   # the notebook-era tests still use it
