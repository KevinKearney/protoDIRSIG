# Run spec: the auror_ref scene, geometry, atmosphere and seed imaged by the synthetic VIS camera.
# Derived from manifold_run_specs/auror_ref.yaml (see its header for the sources of every engine value); only the
# descriptor's name, tags, description, sensor ref, settings entry and fidelity differ. A different sensor
# is a different run spec (CONOPS and Guide §4); protodirsig.run_spec.derive_run_spec writes one.

spec_version: run-spec/1

descriptor:
  meta:
    name: synthetic-vis-static-pose
    tags: [synthetic, vis, static-pose, hypersonic-target]
    description: >
      The auror_ref scene, geometry and atmosphere imaged by the synthetic VIS staring camera
      (manifold_sensors/synthetic_600_200_vis_1920.yaml): same fixed LEO-altitude position over the Tahoe scene.

  origin:
    kind: synthetic
    engine: dirsig

  collection:
    epoch: "2009-07-27T19:29:32Z"        # written as the generated .tasks reference datetime (received file: 11:29:32-08:00)
    platform:
      class: satellite
      position:
        frame: geodetic
        datum: WGS84
        latitude:  {value: 39.0036,   provenance: specified}   # scene origin; axis convention not confirmed
        longitude: {value: -120.0046, provenance: specified}
        altitude:  {value: 550000, provenance: specified}
        altitude_reference: ellipsoid
    geometry:
      regime: orbital_nadir
      range: {value: 500000, provenance: modeled}   # scene-z separation, sensor to target start: |550000 - 50000| m
    illumination:
      regime: daylight
    atmosphere:
      regime: mid_latitude_summer        # vocabulary term; independent of which plugin models it (see engine.atmosphere)
    background:
      regime: rural
    targets:
      - class: vehicle_air               # hypersonic bundle target (hypersonic.glist / hypersonic.mat)

  sensor:
    ref: {name: synthetic_600_200_vis_1920.yaml, content_hash: "sha256:8c01a20c151723fbadf6f46aacc7d97050b7ae5eef732c3111e34ae44fa6aed4"}
    # (sensor-spec/1 extraction, CONOPS and Guide §4) -- content identical to the
    # formerly-inline block; see manifold_sensors/auror-nir.yaml (the sensor library).

  settings:
    - entry_id: synthetic-600-200-vis-1920
      exposure_time: {value: 0.005, provenance: specified}   # capturemethod.temporalintegration, 10 samples
      frame_rate: {value: 1000, provenance: specified}       # detectorarray.clock.rate
      gain: {value: 1, provenance: specified}                # channel at_gain
      black_level: {value: 0, provenance: specified}         # channel at_bias
      roi:                                                   # modeled window, SFNC names; detectorarray.xelementcount / yelementcount
        Width: 500
        Height: 500
        OffsetX: null                                        # position in the full frame; not recorded
        OffsetY: null

  fidelity:
    modeled: [reflective and emissive radiance, atmospheric transmission and path radiance]
    approximated: [detector noise, optics blur, sensor spectral response (synthetic QE and optics curves)]
    absent: [platform jitter]
    valid_for: >
      Scene-radiometry and sensor-chain studies at the modeled band, geometry and atmosphere.
      Not valid for target-visibility studies: the vehicle's material has zero reflectance and its
      1500 K emission is not evaluated in a 0.41-2.0 um job unless temperature prediction is
      forced, so the vehicle renders black.

  extras:
    dirsig.atmosphere_db: jsims/AurorNewAtmosphere   # NewAtmosphere's HDF5 database, role dirsig:atmosphere_db (role R-6)
    dirsig.weather_file: saw.wth

engine:
  generator: {tool: dirfm, revision: "<git-sha>", spec_schema: dirsig-engine/1}

  scenes:
    - ref: {name: scenes/tahoe/tahoe.scene, content_hash: "sha256:<hash>"}
      # Config-repo layout (scenes/<scene>/<scene>.scene, A.8.3), resolved in full as of Stage 04:
      # manifold_config_repo/scenes/tahoe/ holds tahoe.scene plus geometry/ and materials/ as descendants
      # (this scene has no maps/; the convention allows one, per CONOPS and Guide §5), copied once from the
      # received AUROR_ref tree where they sat as siblings at the tree root (FINDINGS.md, Stage 04;
      # guide §9). No longer a flat/nested mismatch.
      offset: [0, 0, 0]

  platform:
    ref: {name: platforms/AurorNIRDetector/AurorNIRDetector.platform, content_hash: "sha256:bed58062f31a1e21945ad357dc36ccfc9e88b5fd14ec4e365a42d2f4df4b2515"}
    # Config-repo layout (platforms/<platform>/<platform>.platform, A.8); previously resolved
    # only by coincidence against the received tree's flat platforms/AurorNIRDetector.platform.
    library_entry: auror-nir-detector
    output_prefix: auror_nir_
    split_channels: false
    integration_samples: 10

  motion:
    kind: static
    position: {frame: scene, xyz: [-400.0, 400.0, 550000.0]}
    orientation:
      kind: euler
      euler: {order: xyz, units: radians, frame: sceneenu, angles: [0.0, 0.0, 3.141592654]}

  tasks:
    windows: [{start: 0.0, stop: 0.0}]

  atmosphere:
    # (2) PROPOSED EXTENSION -- "new_atmosphere" is not an adopted dirsig-engine/1 plugin
    # value (A.8.7 defines only four_curve and basic). This block matches the real tree
    # (role R-6) and is not yet schema-conformant.
    plugin: new_atmosphere
    database:
      ref: {name: atmosphere/AurorNewAtmosphere, content_hash: "sha256:7bbaf61d8a26806d0f22818d5c2b816a62fe69b120e5f2c1ef81d334253b8168"}
      # atmosphere/<name>, flat, is a proposed config-repo convention (guide §9): A.8 defines no
      # library path for new_atmosphere's database, consistent with the plugin itself being a
      # non-adopted extension. Modeled on weather/<name>.wth's flat, single-file convention.

  weather:
    source: library
    file: {name: weather/saw.wth, content_hash: "sha256:7ab85eefcdbb14a945498f5156262d861ec6f933fb10742bde84852c96ef2676"}
    # Already matched the config-repo convention (weather/<name>.wth, A.8) by coincidence; now
    # relocated under manifold_config_repo/ alongside the other assets rather than left in AUROR_ref/.

  ephemeris:
    plugin: spice   # no inputs; reads the DIRSIG installation's kernels (A.6)

  run:
    seed: 42   # (3) confirmed to seed both scene2hdf and dirsig5 (FINDINGS.md, Stage 02)
