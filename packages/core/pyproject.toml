[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eoptic-manifold-core"
version = "0.0.1"
description = "MANIFOLD run specs, engine-neutral: composition, loading and resolution, contract schemas, run and sweep identity, admission, problem details, API models"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "jsonschema",
    "lxml",
    "numpy",          # imported inside the functions that compute with it (spectral curves, orbit tables), never at import
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["manifold.core*"]   # `manifold` is a PEP 420 namespace: no distribution ships manifold/__init__.py
namespaces = true

[tool.setuptools.package-data]
"manifold.core" = ["_contracts/*.json"]   # copied from the repository's manifold_contracts/ at build time (setup.py); not tracked
