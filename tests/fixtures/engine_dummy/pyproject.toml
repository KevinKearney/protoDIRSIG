# A test fixture, not shipped: the smallest engine distribution, used by tests/test_engine_dummy.py to show that an
# engine is added by installing a distribution, with no change to manifold.core or manifold.sim.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eoptic-manifold-engine-dummy"
version = "0.0.1"
description = "Test fixture: a dummy MANIFOLD engine (counts frames into text files) behind the engine adapter protocol"
requires-python = ">=3.10"
dependencies = ["eoptic-manifold-core==0.0.1"]

[project.entry-points."manifold.engines"]
dummy = "manifold.engines.dummy.adapter:DummyAdapter"

[tool.setuptools.packages.find]
where = ["src"]
include = ["manifold.engines.dummy*"]
namespaces = true

[tool.setuptools.package-data]
"manifold.engines.dummy" = ["*.json", "engine.py"]
